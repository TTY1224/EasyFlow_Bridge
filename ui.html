<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>EasyFlow 橋接</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 配色與圓角刻意跟主網站（FW 數據平台）一致：近黑底、皇家藍/天藍、一抹閃電黃、
     尖角四邊形（FW 官網風，不是圓角）、玻璃卡片。變數名也照抄，好對照。 */
  :root {
    --font-ui: "Outfit", "Noto Sans TC", "Segoe UI", -apple-system, sans-serif;
    --font-zh: "Noto Sans TC", "Microsoft JhengHei", sans-serif;

    --r-sm: 3px; --r-md: 4px; --r-lg: 6px; --r-xl: 8px; --r-pill: 999px;

    --fw-yellow: #eaff00;
    --fw-line: rgba(90, 150, 250, .22);

    --bg-0: #0c0c10;
    --bg-1: #121214;
    --card: #1a1a1d;

    --text-1: #f4f6fa;
    --text-2: rgba(236, 240, 250, .62);
    --text-3: rgba(236, 240, 250, .4);

    --accent: #4a86f2;
    --accent-2: #7aaaff;
    --accent-soft: rgba(74, 134, 242, .16);

    --spark: var(--fw-yellow);
    --pos: #58d6a0;
    --neg: #ff6b7a;

    --glass-bg: linear-gradient(150deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .022));
    --glass-border: var(--fw-line);
    --glass-edge: inset 0 1px 0 rgba(140, 180, 255, .1);
    --glass-shadow: 0 16px 40px -22px rgba(0, 0, 6, .85);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    font-size: 13px; line-height: 1.6;
    color: var(--text-1);
    background: var(--bg-0);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  /* 主網站的光暈背景 */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60% 45% at 12% 0%, rgba(20, 100, 235, .20), transparent 70%),
      radial-gradient(50% 40% at 100% 22%, rgba(45, 135, 245, .12), transparent 72%),
      radial-gradient(40% 30% at 50% 100%, rgba(234, 255, 0, .045), transparent 70%);
  }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow), var(--glass-edge);
    border-radius: var(--r-lg);
  }

  header {
    padding: 18px 22px 15px;
    border-bottom: 1px solid var(--fw-line);
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .04), transparent);
  }
  header img { width: 30px; height: 30px; border-radius: var(--r-md); }
  .htxt .kick {
    font-size: 9px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 2px;
  }
  .htxt h1 { font-size: 15px; font-weight: 600; letter-spacing: .01em; }

  .pill {
    margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: var(--r-pill);
    font-size: 11px; font-weight: 600; letter-spacing: .02em;
    border: 1px solid var(--fw-line); color: var(--text-2);
    background: rgba(255, 255, 255, .03);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
  .pill.online { color: var(--pos); border-color: rgba(88, 214, 160, .35); }
  .pill.online .dot { background: var(--pos); box-shadow: 0 0 8px var(--pos); animation: pulse 2s infinite; }
  .pill.busy { color: var(--accent-2); border-color: rgba(74, 134, 242, .4); }
  .pill.busy .dot { background: var(--accent-2); box-shadow: 0 0 8px var(--accent); animation: pulse .9s infinite; }
  .pill.err { color: var(--neg); border-color: rgba(255, 107, 122, .35); }
  .pill.err .dot { background: var(--neg); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

  main { flex: 1; overflow-y: auto; padding: 20px 22px; }

  /* ── 設定畫面 ── */
  .fld { margin-bottom: 15px; }
  .fld label {
    display: block; font-size: 10px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 6px;
  }
  .fld .hint { font-size: 11px; color: var(--text-3); margin-top: 5px; }
  .fld .hint a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .fld .hint a:hover { color: var(--accent-2); }
  input {
    width: 100%; padding: 10px 12px;
    border-radius: var(--r-md); border: 1px solid var(--fw-line);
    background: rgba(255, 255, 255, .035); color: var(--text-1);
    font-family: var(--font-ui); font-size: 13px; outline: none;
    transition: border-color .18s, background .18s;
    -webkit-user-select: text; user-select: text;
  }
  input::placeholder { color: var(--text-3); }
  input:focus { border-color: var(--accent); background: rgba(74, 134, 242, .07); }

  button {
    padding: 10px 20px; border-radius: var(--r-md); border: 1px solid transparent;
    background: var(--accent); color: #fff;
    font-family: var(--font-ui); font-size: 13px; font-weight: 600; letter-spacing: .02em;
    cursor: pointer; transition: background .18s, border-color .18s;
  }
  button:hover { background: var(--accent-2); }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; border-color: var(--fw-line); color: var(--text-2); font-weight: 500; }
  button.ghost:hover { background: rgba(255, 255, 255, .05); color: var(--text-1); }
  .row { display: flex; gap: 9px; align-items: center; margin-top: 20px; }

  .err {
    margin-top: 15px; padding: 11px 13px; border-radius: var(--r-md);
    font-size: 12px; line-height: 1.7;
    background: rgba(255, 107, 122, .1); border: 1px solid rgba(255, 107, 122, .25);
    color: #ffb0b8;
  }

  /* ── 檢查進度 ── */
  .lead { font-size: 12px; color: var(--text-2); line-height: 1.8; margin-bottom: 4px; }
  .steps { margin-top: 16px; }
  .step {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 0; font-size: 13px; color: var(--text-3);
    border-bottom: 1px solid rgba(90, 150, 250, .08);
  }
  .step:last-child { border-bottom: 0; }
  .step .ic { width: 16px; text-align: center; font-size: 12px; }
  .step.run { color: var(--text-1); } .step.run .ic { color: var(--accent-2); }
  .step.done { color: var(--text-2); } .step.done .ic { color: var(--pos); }
  .step.fail { color: var(--text-1); } .step.fail .ic { color: var(--neg); }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 執行中畫面 ── */
  .who { padding: 14px 16px; margin-bottom: 14px; }
  .who div { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; padding: 4px 0; }
  .who span { color: var(--text-3); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .who b { color: var(--text-1); font-weight: 500; -webkit-user-select: text; user-select: text; }

  .note {
    padding: 11px 14px; margin-bottom: 14px;
    border-radius: var(--r-md); font-size: 12px; line-height: 1.7;
    background: rgba(234, 255, 0, .05); border-left: 2px solid var(--spark);
    color: var(--text-2);
  }
  .logh {
    font-size: 9px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 8px;
  }
  .log {
    border-radius: var(--r-md); background: rgba(0, 0, 0, .35);
    border: 1px solid rgba(90, 150, 250, .12);
    padding: 11px 13px; max-height: 38vh; overflow-y: auto;
    font-size: 12px; line-height: 1.9;
    -webkit-user-select: text; user-select: text;
  }
  .log .ln { display: flex; gap: 10px; }
  .log .tm { color: rgba(236, 240, 250, .28); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .log .tx { color: var(--text-2); word-break: break-word; }
  .log .ok .tx { color: var(--pos); }
  .log .err .tx { color: var(--neg); }
  .log .warn .tx { color: var(--spark); }
  .log .task .tx { color: var(--accent-2); }
  .log .empty { color: var(--text-3); }

  footer {
    padding: 13px 22px; border-top: 1px solid var(--fw-line);
    display: flex; gap: 9px;
    background: linear-gradient(0deg, rgba(255, 255, 255, .03), transparent);
  }
  footer .sp { margin-left: auto; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(90, 150, 250, .2); border-radius: var(--r-pill); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(90, 150, 250, .35); }
</style>
</head>
<body>
<header>
  <img id="logo" alt="">
  <div class="htxt">
    <div class="kick">Bridge</div>
    <h1>EasyFlow 橋接</h1>
  </div>
  <div class="pill" id="pill"><span class="dot"></span><span id="pillTxt">啟動中</span></div>
</header>

<main id="main"></main>
<footer id="footer"></footer>

<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hhmm = (ts) => new Date(ts).toTimeString().slice(0, 8);

let view = "";          // 目前畫的是哪個畫面，避免每次輪詢都重畫把輸入框清掉
let logCount = -1;

async function api(path, body) {
  const r = await fetch(path, body ? {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  } : undefined);
  return r.json();
}

/* ── 剛啟動、還在判斷要顯示什麼 ── */
function drawBoot() {
  if (view === "boot") return;
  view = "boot";
  document.getElementById("main").innerHTML =
    '<p class="lead"><span class="spin">◐</span>&nbsp; 啟動中…</p>';
  document.getElementById("footer").innerHTML = "";
}

/* ── 設定畫面 ── */
function drawSetup(st) {
  if (view === "setup") return;
  view = "setup";
  document.getElementById("main").innerHTML = `
    <div class="fld">
      <label>① 數據網站的登入 email</label>
      <input id="f_email" type="email" placeholder="xxx@gmail.com" autocomplete="off">
    </div>
    <div class="fld">
      <label>② 授權碼</label>
      <input id="f_token" type="text" placeholder="從網站複製過來" autocomplete="off">
      <div class="hint"><a href="#" id="openSetup">取得授權碼</a></div>
    </div>
    <div class="fld">
      <label>③ EasyFlow 帳號</label>
      <input id="f_user" type="text" placeholder="簽單系統的帳號，不是 email" autocomplete="off">
    </div>
    <div class="fld">
      <label>④ EasyFlow 密碼</label>
      <input id="f_pass" type="password" placeholder="只會存在這台電腦" autocomplete="off">
    </div>
    <div class="row"><button id="go">檢查並儲存</button></div>
    <div id="msg"></div>`;
  document.getElementById("footer").innerHTML = "";

  const cur = st.config || {};
  if (cur.email) document.getElementById("f_email").value = cur.email;
  if (cur.easyflowUser) document.getElementById("f_user").value = cur.easyflowUser;

  document.getElementById("openSetup").onclick = (e) => { e.preventDefault(); api("/open-setup-page", {}); };
  document.getElementById("go").onclick = submit;
  for (const id of ["f_email", "f_token", "f_user", "f_pass"]) {
    document.getElementById(id).addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  }
}

async function submit() {
  const body = {
    email: document.getElementById("f_email").value.trim(),
    token: document.getElementById("f_token").value.trim(),
    easyflowUser: document.getElementById("f_user").value.trim(),
    easyflowPass: document.getElementById("f_pass").value,
  };
  const msg = document.getElementById("msg");
  if (!body.email.includes("@")) { msg.innerHTML = '<div class="err">第 ① 個欄位看起來不像 email</div>'; return; }
  if (body.token.length < 20) { msg.innerHTML = '<div class="err">授權碼看起來太短，應該有 30 幾個字</div>'; return; }
  if (!body.easyflowUser || !body.easyflowPass) { msg.innerHTML = '<div class="err">EasyFlow 的帳號或密碼還沒填</div>'; return; }
  msg.innerHTML = "";
  document.getElementById("go").disabled = true;
  await api("/setup", body);
  view = "";      // 讓輪詢重畫成「檢查進度」
}

/* ── 檢查進度 ── */
const STEP_ICON = { wait: "○", run: '<span class="spin">◐</span>', done: "✓", fail: "✕" };
function drawChecking(st) {
  view = "checking";
  const s = st.setup;
  document.getElementById("main").innerHTML = `
    <p class="lead">檢查中，大概 20～30 秒。過程中會閃一下瀏覽器視窗，那是在測登入，正常的。</p>
    <div class="glass steps" style="padding:6px 16px">${s.steps.map((x) => `
      <div class="step ${x.status}"><span class="ic">${STEP_ICON[x.status] || "○"}</span><span>${esc(x.name)}</span></div>
    `).join("")}</div>
    ${s.error ? `<div class="err">${esc(s.error)}</div>
      <div class="row"><button class="ghost" id="back">回去改</button></div>` : ""}`;
  if (s.error) document.getElementById("back").onclick = () => { api("/setup-reset", {}); view = ""; };
}

/* ── 執行中畫面 ── */
function drawRunning(st) {
  if (view !== "running") {
    view = "running";
    document.getElementById("main").innerHTML = `
      <div class="glass who">
        <div><span>你的帳號</span><b>${esc(st.config.email || "")}</b></div>
        <div><span>EasyFlow</span><b>${esc(st.config.easyflowUser || "")}</b></div>
      </div>
      <div class="note">這個視窗要留著開，關掉就等於下線。回網站跟 Woby 說話就可以了。</div>
      <div class="logh">動態</div>
      <div class="log" id="log"></div>`;
    document.getElementById("footer").innerHTML = `
      <button class="ghost" id="reset">重新設定</button>
      <button class="ghost sp" id="quit">結束</button>`;
    document.getElementById("reset").onclick = () => {
      if (confirm("重新設定？\n\n現在的設定會被清掉，要重新輸入帳號密碼。")) { api("/setup-reset", { wipe: true }); view = ""; }
    };
    document.getElementById("quit").onclick = () => {
      api("/quit", {});
      document.body.innerHTML = '<div style="display:flex;height:100vh;align-items:center;justify-content:center;'
        + 'color:rgba(236,240,250,.4);font-family:Outfit,\'Noto Sans TC\',sans-serif;font-size:13px">'
        + '已結束，可以關掉這個視窗了</div>';
    };
    logCount = -1;
  }
  if (st.log.length !== logCount) {
    logCount = st.log.length;
    const el = document.getElementById("log");
    el.innerHTML = st.log.length
      ? st.log.map((l) => `<div class="ln ${l.kind}"><span class="tm">${hhmm(l.at)}</span><span class="tx">${esc(l.text)}</span></div>`).join("")
      : '<div class="empty">還沒有動作。到網站上跟 Woby 說「幫我請假」試試。</div>';
    el.scrollTop = el.scrollHeight;
  }
}

/* ── 狀態列 ── */
function drawPill(st) {
  const p = document.getElementById("pill"), t = document.getElementById("pillTxt");
  let cls = "", txt = "啟動中";
  if (st.screen === "boot") { txt = "啟動中"; }
  else if (st.screen === "setup") { txt = "還沒設定"; }
  else if (st.screen === "checking") { txt = "檢查中"; cls = "busy"; }
  else if (st.busy) { txt = st.task || "處理中"; cls = "busy"; }
  else if (st.status === "online") { txt = "已上線"; cls = "online"; }
  else if (st.status === "connecting") { txt = "連線中"; }
  else if (st.status === "duplicate") { txt = "重複開啟"; cls = "err"; }
  else if (st.status === "offline") { txt = "離線"; cls = "err"; }
  p.className = "pill " + cls;
  t.textContent = txt;
}

async function tick() {
  try {
    const st = await api("/state");
    drawPill(st);
    if (st.screen === "boot") drawBoot();
    else if (st.screen === "setup") drawSetup(st);
    else if (st.screen === "checking") drawChecking(st);
    else drawRunning(st);
  } catch { /* 主程式關了，下一輪再試 */ }
}

// 視窗關掉的時候通知主程式收工（沒有小黑窗，這是使用者唯一的關閉方式）
addEventListener("pagehide", () => { try { navigator.sendBeacon("/bye"); } catch {} });

fetch("/logo").then((r) => r.text()).then((d) => { document.getElementById("logo").src = d; }).catch(() => {});
tick();
setInterval(tick, 1200);
</script>
</body>
</html>
