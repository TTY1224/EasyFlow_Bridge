<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>EasyFlow 橋接</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 配色與圓角刻意跟主網站（FW 數據平台）一致：近黑底、皇家藍/天藍、一抹閃電黃、
     尖角四邊形（FW 官網風，不是圓角）、玻璃卡片。變數名也照抄，好對照。 */
  :root {
    --font-ui: "Outfit", "Noto Sans TC", "Segoe UI", -apple-system, sans-serif;
    --font-zh: "Noto Sans TC", "Microsoft JhengHei", sans-serif;

    --r-sm: 3px; --r-md: 4px; --r-lg: 6px; --r-xl: 8px; --r-pill: 999px;

    --fw-yellow: #eaff00;
    --fw-line: rgba(90, 150, 250, .22);

    --bg-0: #0c0c10;
    --bg-1: #121214;
    --card: #1a1a1d;

    --text-1: #f4f6fa;
    --text-2: rgba(236, 240, 250, .62);
    --text-3: rgba(236, 240, 250, .4);

    --accent: #4a86f2;
    --accent-2: #7aaaff;
    --accent-soft: rgba(74, 134, 242, .16);

    --spark: var(--fw-yellow);
    --pos: #58d6a0;
    --neg: #ff6b7a;

    --glass-bg: linear-gradient(150deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .022));
    --glass-border: var(--fw-line);
    --glass-edge: inset 0 1px 0 rgba(140, 180, 255, .1);
    --glass-shadow: 0 16px 40px -22px rgba(0, 0, 6, .85);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    font-size: 13px; line-height: 1.6;
    color: var(--text-1);
    background: var(--bg-0);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  /* 主網站的光暈背景 */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60% 45% at 12% 0%, rgba(20, 100, 235, .20), transparent 70%),
      radial-gradient(50% 40% at 100% 22%, rgba(45, 135, 245, .12), transparent 72%),
      radial-gradient(40% 30% at 50% 100%, rgba(234, 255, 0, .045), transparent 70%);
  }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow), var(--glass-edge);
    border-radius: var(--r-lg);
  }

  header {
    padding: 18px 22px 15px;
    border-bottom: 1px solid var(--fw-line);
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .04), transparent);
  }
  header img { width: 30px; height: 30px; border-radius: var(--r-md); }
  .htxt .kick {
    font-size: 9px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 2px;
  }
  .htxt h1 { font-size: 15px; font-weight: 600; letter-spacing: .01em; }

  /* 狀態標籤：平行四邊形（照主網站 skewX(-9deg) 的風格，文字不歪）。
     上線＝閃電黃邊框＋外圈光暈；其他狀態換顏色但形狀一樣。 */
  .pill {
    margin-left: auto;                 /* header 靠右，別拿掉 */
    position: relative; z-index: 0;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 15px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
    color: var(--text-3); white-space: nowrap;
  }
  .pill::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    transform: skewX(-9deg); border-radius: 2px;
    border: 1px solid var(--fw-line); background: rgba(255, 255, 255, .03);
    transition: border-color .3s ease, box-shadow .3s ease, background .3s ease;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; opacity: .85; flex: 0 0 auto;
  }
  /* 已上線 */
  .pill.online { color: var(--fw-yellow); }
  .pill.online::before {
    border-color: rgba(234, 255, 0, .75);
    background: rgba(234, 255, 0, .07);
    box-shadow: 0 0 14px -2px rgba(234, 255, 0, .55), inset 0 0 12px -6px rgba(234, 255, 0, .6);
  }
  .pill.online .dot { animation: pulse 2s ease-in-out infinite; }
  /* 忙碌中 */
  .pill.busy { color: var(--accent-2); }
  .pill.busy::before { border-color: rgba(122, 170, 255, .6); box-shadow: 0 0 12px -3px rgba(74, 134, 242, .5); }
  .pill.busy .dot { animation: pulse 1s ease-in-out infinite; }
  /* 出問題 */
  .pill.err { color: var(--neg); }
  .pill.err::before { border-color: rgba(255, 107, 122, .6); box-shadow: 0 0 12px -3px rgba(255, 107, 122, .5); }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  main { flex: 1; overflow-y: auto; padding: 20px 22px; }

  /* ── 設定畫面 ── */
  .fld { margin-bottom: 15px; }
  .fld label {
    display: block; font-size: 10px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 6px;
  }
  .fld .hint { font-size: 11px; color: var(--text-3); margin-top: 5px; }
  .fld .hint a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .fld .hint a:hover { color: var(--accent-2); }
  input {
    width: 100%; padding: 10px 12px;
    border-radius: var(--r-md); border: 1px solid var(--fw-line);
    background: rgba(255, 255, 255, .035); color: var(--text-1);
    font-family: var(--font-ui); font-size: 13px; outline: none;
    transition: border-color .18s, background .18s;
    -webkit-user-select: text; user-select: text;
  }
  input::placeholder { color: var(--text-3); }
  input:focus { border-color: var(--accent); background: rgba(74, 134, 242, .07); }

  button {
    padding: 10px 20px; border-radius: var(--r-md); border: 1px solid transparent;
    background: var(--accent); color: #fff;
    font-family: var(--font-ui); font-size: 13px; font-weight: 600; letter-spacing: .02em;
    cursor: pointer; transition: background .18s, border-color .18s;
  }
  button:hover { background: var(--accent-2); }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; border-color: var(--fw-line); color: var(--text-2); font-weight: 500; }
  button.ghost:hover { background: rgba(255, 255, 255, .05); color: var(--text-1); }
  .row { display: flex; gap: 9px; align-items: center; margin-top: 20px; }

  /* 瀏覽器選擇（分段式按鈕） */
  .seg { display: flex; gap: 0; border: 1px solid var(--fw-line); border-radius: var(--r-md); overflow: hidden; }
  .seg button {
    flex: 1; padding: 9px 0; border: 0; border-radius: 0;
    background: rgba(255, 255, 255, .03); color: var(--text-2); font-weight: 500;
  }
  .seg button + button { border-left: 1px solid var(--fw-line); }
  .seg button:hover { background: rgba(255, 255, 255, .07); color: var(--text-1); }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .seg button.on:hover { background: var(--accent); }
  /* 瀏覽器切換（執行中畫面，資訊卡右邊）
     照主網站的做法：平行四邊形是 skewX(-9deg) 的**背景**，文字不歪。
     高亮是一塊會滑過去的方塊，放在已經 skew 過的軌道裡面 —— 這樣它自己只要
     translateX 就好，不用自己算斜邊，也不會跟 skew 打架。 */
  .pseg { position: relative; display: inline-flex; --i: 0; --n: 2; }
  .pseg .track {
    position: absolute; inset: 0; overflow: hidden;
    transform: skewX(-9deg); border-radius: 2px;
    background: rgba(255, 255, 255, .04); border: 1px solid var(--fw-line);
  }
  .pseg .ind {
    position: absolute; top: -1px; bottom: -1px; left: -1px;
    width: var(--w, 50%);
    background: linear-gradient(135deg, #f5ff5a, var(--fw-yellow));
    box-shadow: 0 0 16px -3px rgba(234, 255, 0, .55);
    transform: translateX(var(--x, 0));
    /* 稍微過衝一下再回來，滑起來才有勁 */
    transition: transform .42s cubic-bezier(.32, 1.5, .38, 1), width .42s cubic-bezier(.32, 1.5, .38, 1);
  }
  .pseg button {
    position: relative; z-index: 1; flex: 1;
    padding: 5px 15px; border: 0; border-radius: 0; background: transparent;
    color: var(--text-3); font-size: 11px; font-weight: 600; letter-spacing: .04em;
    transition: color .3s ease, text-shadow .3s ease;
  }
  .pseg button:hover { color: var(--text-2); }
  /* 黃底配近黑的字（跟主網站的黃色平行四邊形標題一樣的做法） */
  .pseg button.on { color: #14140f; font-weight: 700; text-shadow: none; }
  .pseg button.on:hover { color: #14140f; }

  .err {
    margin-top: 15px; padding: 11px 13px; border-radius: var(--r-md);
    font-size: 12px; line-height: 1.7;
    background: rgba(255, 107, 122, .1); border: 1px solid rgba(255, 107, 122, .25);
    color: #ffb0b8;
  }

  /* ── 檢查進度 ── */
  .lead { font-size: 12px; color: var(--text-2); line-height: 1.8; margin-bottom: 4px; }
  .steps { margin-top: 16px; }
  .step {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 0; font-size: 13px; color: var(--text-3);
    border-bottom: 1px solid rgba(90, 150, 250, .08);
  }
  .step:last-child { border-bottom: 0; }
  .step .ic { width: 16px; text-align: center; font-size: 12px; }
  .step.run { color: var(--text-1); } .step.run .ic { color: var(--accent-2); }
  .step.done { color: var(--text-2); } .step.done .ic { color: var(--pos); }
  .step.fail { color: var(--text-1); } .step.fail .ic { color: var(--neg); }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 執行中畫面 ── */
  .who { padding: 14px 16px; margin-bottom: 14px; }
  .who div { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; padding: 4px 0; }
  .who span { color: var(--text-3); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .who b { color: var(--text-1); font-weight: 500; -webkit-user-select: text; user-select: text; }

  /* 動態：預設收起來，想看的人自己點開 */
  .logt {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 9px 12px; border-radius: var(--r-md);
    background: transparent; border: 1px solid var(--fw-line);
    color: var(--text-3); font-size: 11px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; text-align: left;
  }
  .logt:hover { background: rgba(255, 255, 255, .04); color: var(--text-2); }
  .logt .ar { color: var(--accent); font-size: 9px; transition: transform .18s; }
  .logt.open .ar { transform: rotate(90deg); }
  /* 收起來的時候在標題旁邊顯示最後一句，這樣不用展開也知道剛剛發生什麼 */
  .logt .last {
    margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400;
    font-size: 11px; color: var(--text-3);
    max-width: 58%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .log { margin-top: 8px; }
  .log[hidden] { display: none; }
  .log {
    border-radius: var(--r-md); background: rgba(0, 0, 0, .35);
    border: 1px solid rgba(90, 150, 250, .12);
    padding: 11px 13px; max-height: 38vh; overflow-y: auto;
    font-size: 12px; line-height: 1.9;
    -webkit-user-select: text; user-select: text;
  }
  .log .ln { display: flex; gap: 10px; }
  .log .tm { color: rgba(236, 240, 250, .28); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .log .tx { color: var(--text-2); word-break: break-word; }
  .log .ok .tx { color: var(--pos); }
  .log .err .tx { color: var(--neg); }
  .log .warn .tx { color: var(--spark); }
  .log .task .tx { color: var(--accent-2); }
  .log .empty { color: var(--text-3); }

  footer {
    padding: 13px 22px; border-top: 1px solid var(--fw-line);
    display: flex; gap: 9px;
    background: linear-gradient(0deg, rgba(255, 255, 255, .03), transparent);
  }
  footer .sp { margin-left: auto; }

  /* ── 接上線的那一刻：整個視窗的邊框繞一圈 AI 彩光 ──────────────────
     跟數據網站那邊同時亮（網站是 .blg，用色與掃動一模一樣），
     做出「兩邊接上線」的感覺。conic 漸層用 mask 把中間挖掉，只留邊框那幾 px。
     純視覺、pointer-events: none，不會擋到任何按鈕。 */
  @property --cvA { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .glow { position: fixed; inset: 0; z-index: 99; pointer-events: none; opacity: 0; }
  .glow.on { animation: glowIn .45s ease forwards, glowOut .9s ease 2.55s forwards; }
  .glow::before, .glow i {
    content: ""; position: absolute; inset: 0; display: block;
    background: conic-gradient(from var(--cvA), #ff9f0a, #ff375f, #bf5af2, #5e5ce6, #0a84ff, #64d2ff, #2bd1c0, #ff9f0a);
    animation: cvSweep 2.4s linear infinite;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  .glow::before { padding: 10px; filter: blur(13px) saturate(1.45); opacity: .55; }   /* 外擴柔光 */
  .glow i { padding: 2px; }                                                           /* 貼邊細霓虹線 */
  @keyframes cvSweep { to { --cvA: 360deg; } }
  @keyframes glowIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes glowOut { from { opacity: 1; } to { opacity: 0; } }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(90, 150, 250, .2); border-radius: var(--r-pill); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(90, 150, 250, .35); }
</style>
</head>
<body>
<header>
  <img id="logo" alt="">
  <div class="htxt">
    <div class="kick">Bridge</div>
    <h1>EasyFlow 橋接</h1>
  </div>
  <div class="pill" id="pill"><span class="dot"></span><span id="pillTxt">啟動中</span></div>
</header>

<div class="glow" id="glow" aria-hidden="true"><i></i></div>
<main id="main"></main>
<footer id="footer"></footer>

<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hhmm = (ts) => new Date(ts).toTimeString().slice(0, 8);

let view = "";          // 目前畫的是哪個畫面，避免每次輪詢都重畫把輸入框清掉
let logCount = -1;
let logOpen = false;     // 動態預設收起來（要看的人自己展開）
let syncBrowser = null;  // 把高亮移到目前這個瀏覽器（每次輪詢都對一次，位置就不會跑掉）
let pickedBrowser = "";  // 使用者選的瀏覽器（空的就讓後端自動挑）

async function api(path, body) {
  const r = await fetch(path, body ? {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  } : undefined);
  return r.json();
}

/* ── 剛啟動、還在判斷要顯示什麼 ── */
function drawBoot() {
  if (view === "boot") return;
  view = "boot";
  document.getElementById("main").innerHTML =
    '<p class="lead"><span class="spin">◐</span>&nbsp; 啟動中…</p>';
  document.getElementById("footer").innerHTML = "";
}

/* ── 設定畫面 ── */
function drawSetup(st) {
  if (view === "setup") return;
  view = "setup";
  document.getElementById("main").innerHTML = `
    <div class="fld">
      <label>① 數據網站的登入 email</label>
      <input id="f_email" type="email" placeholder="xxx@gmail.com" autocomplete="off">
    </div>
    <div class="fld">
      <label>② 授權碼</label>
      <input id="f_token" type="text" placeholder="從網站複製過來" autocomplete="off">
      <div class="hint"><a href="#" id="openSetup">取得授權碼</a></div>
    </div>
    <div class="fld">
      <label>③ EasyFlow 帳號</label>
      <input id="f_user" type="text" placeholder="簽單系統的帳號，不是 email" autocomplete="off">
    </div>
    <div class="fld">
      <label>④ EasyFlow 密碼</label>
      <input id="f_pass" type="password" placeholder="只會存在這台電腦" autocomplete="off">
    </div>
    <div class="fld" id="browserFld" style="display:none">
      <label>⑤ 用哪個瀏覽器</label>
      <div class="seg" id="browserSeg"></div>
      <div class="hint">填單和這個視窗都會用它。挑你平常在用的那個。</div>
    </div>
    <div class="row"><button id="go">檢查並儲存</button></div>
    <div id="msg"></div>`;
  document.getElementById("footer").innerHTML = "";

  const cur = st.config || {};
  if (cur.email) document.getElementById("f_email").value = cur.email;
  if (cur.easyflowUser) document.getElementById("f_user").value = cur.easyflowUser;

  document.getElementById("openSetup").onclick = (e) => { e.preventDefault(); api("/open-setup-page", {}); };

  // 只列這台真的裝了的。只有一個就不用問了，直接用。
  fetch("/browsers").then((r) => r.json()).then(({ list }) => {
    if (!list || list.length < 2) { pickedBrowser = list && list[0] ? list[0].channel : ""; return; }
    pickedBrowser = cur.browser && list.some((x) => x.channel === cur.browser) ? cur.browser : list[0].channel;
    const seg = document.getElementById("browserSeg");
    seg.innerHTML = list.map((x) =>
      `<button type="button" data-ch="${x.channel}">${esc(x.label)}</button>`).join("");
    const paint = () => seg.querySelectorAll("button").forEach((b) => {
      b.className = b.dataset.ch === pickedBrowser ? "on" : "";
    });
    seg.querySelectorAll("button").forEach((b) => {
      b.onclick = () => { pickedBrowser = b.dataset.ch; paint(); };
    });
    paint();
    document.getElementById("browserFld").style.display = "";
  }).catch(() => { /* 抓不到就交給後端自動挑 */ });
  document.getElementById("go").onclick = submit;
  for (const id of ["f_email", "f_token", "f_user", "f_pass"]) {
    document.getElementById(id).addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  }
}

async function submit() {
  const body = {
    email: document.getElementById("f_email").value.trim(),
    token: document.getElementById("f_token").value.trim(),
    easyflowUser: document.getElementById("f_user").value.trim(),
    easyflowPass: document.getElementById("f_pass").value,
    browser: pickedBrowser,
  };
  const msg = document.getElementById("msg");
  if (!body.email.includes("@")) { msg.innerHTML = '<div class="err">第 ① 個欄位看起來不像 email</div>'; return; }
  if (body.token.length < 20) { msg.innerHTML = '<div class="err">授權碼看起來太短，應該有 30 幾個字</div>'; return; }
  if (!body.easyflowUser || !body.easyflowPass) { msg.innerHTML = '<div class="err">EasyFlow 的帳號或密碼還沒填</div>'; return; }
  msg.innerHTML = "";
  document.getElementById("go").disabled = true;
  await api("/setup", body);
  view = "";      // 讓輪詢重畫成「檢查進度」
}

/* ── 檢查進度 ── */
const STEP_ICON = { wait: "○", run: '<span class="spin">◐</span>', done: "✓", fail: "✕" };
function drawChecking(st) {
  view = "checking";
  const s = st.setup;
  document.getElementById("main").innerHTML = `
    <p class="lead">檢查中，大概 20～30 秒。過程中會閃一下瀏覽器視窗，那是在測登入，正常的。</p>
    <div class="glass steps" style="padding:6px 16px">${s.steps.map((x) => `
      <div class="step ${x.status}"><span class="ic">${STEP_ICON[x.status] || "○"}</span><span>${esc(x.name)}</span></div>
    `).join("")}</div>
    ${s.error ? `<div class="err">${esc(s.error)}</div>
      <div class="row"><button class="ghost" id="back">回去改</button></div>` : ""}`;
  if (s.error) document.getElementById("back").onclick = () => { api("/setup-reset", {}); view = ""; };
}

/* ── 執行中畫面 ── */
function drawRunning(st) {
  if (view !== "running") {
    view = "running";
    document.getElementById("main").innerHTML = `
      <div class="glass who">
        <div><span>你的帳號</span><b>${esc(st.config.email || "")}</b></div>
        <div><span>EasyFlow</span><b>${esc(st.config.easyflowUser || "")}</b></div>
        <div id="browserRow" style="display:none"><span>瀏覽器</span><div class="pseg" id="browserSeg2"></div></div>
      </div>
      <button type="button" class="logt" id="logt">
        <span class="ar">▶</span><span>動態</span><span class="last" id="logLast"></span>
      </button>
      <div class="log" id="log" hidden></div>`;
    document.getElementById("footer").innerHTML = `
      <button class="ghost" id="reset">重新設定</button>
      <button class="ghost sp" id="quit">結束</button>`;
    document.getElementById("reset").onclick = () => {
      if (confirm("重新設定？\n\n現在的設定會被清掉，要重新輸入帳號密碼。")) { api("/setup-reset", { wipe: true }); view = ""; }
    };
    document.getElementById("quit").onclick = () => {
      api("/quit", {});
      document.body.innerHTML = '<div style="display:flex;height:100vh;align-items:center;justify-content:center;'
        + 'color:rgba(236,240,250,.4);font-family:Outfit,\'Noto Sans TC\',sans-serif;font-size:13px">'
        + '已結束，可以關掉這個視窗了</div>';
    };
    // 動態：點標題才展開。收起來的時候旁邊會顯示最後一句。
    const lt = document.getElementById("logt");
    lt.onclick = () => {
      logOpen = !logOpen;
      lt.classList.toggle("open", logOpen);
      const el = document.getElementById("log");
      el.hidden = !logOpen;
      document.getElementById("logLast").style.display = logOpen ? "none" : "";
      if (logOpen) {
        el.scrollTop = el.scrollHeight;
        // 視窗不高，展開後把畫面往下捲，不然剛展開的東西在下面看不到
        document.getElementById("main").scrollTop = 99999;
      }
    };

    // 瀏覽器：直接切，不用重新設定。只列這台電腦真的裝了的。
    fetch("/browsers").then((r) => r.json()).then(({ list }) => {
      if (!list || list.length < 2) return;            // 只有一個就不用給選了
      // ⚠️ 要先把這一排顯示出來再量按鈕 —— display:none 的元素 offsetWidth 是 0，
      // 高亮會變成 2px 的一小條（踩過）。
      document.getElementById("browserRow").style.display = "";
      const seg = document.getElementById("browserSeg2");
      // 一次畫好就不再重畫 —— 切換只改 --i 讓高亮自己滑過去。
      // （之前是每次切換都重畫 innerHTML，那樣元素被換掉，CSS 動畫根本跑不起來。）
      seg.style.setProperty("--n", list.length);
      seg.innerHTML = '<span class="track"><span class="ind"></span></span>'
        + list.map((x) => `<button type="button" data-ch="${x.channel}">${esc(x.label)}</button>`).join("");
      const btns = [...seg.querySelectorAll("button")];
      let cur = st.config.browser || list[0].channel;
      const slide = (ch) => {
        const i = list.findIndex((x) => x.channel === ch);
        if (i < 0) return;
        const b = btns[i];
        // 照真實按鈕的位置和寬度擺（Edge 57px、Chrome 73px，寬度不一樣，
        // 用「軌道的一半」算會對不齊 —— 踩過）
        seg.style.setProperty("--x", (b.offsetLeft - 1) + "px");
        seg.style.setProperty("--w", (b.offsetWidth + 2) + "px");
        btns.forEach((x, k) => x.classList.toggle("on", k === i));
      };
      slide(cur);
      // 字體（Outfit）是 Google Fonts 非同步載的，載完按鈕會變寬 —— 再量一次
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => slide(cur));
      // 每次輪詢都照後端的設定對一次位置。這樣就算建立的時候剛好還沒拿到設定
      // （或設定被別的地方改掉），高亮也會自己回到對的那一格。
      syncBrowser = (ch) => { if (ch && ch !== cur) { cur = ch; slide(ch); } };
      btns.forEach((b) => {
        b.onclick = async () => {
          const ch = b.dataset.ch;
          if (ch === cur) return;
          const prev = cur;
          cur = ch;
          slide(ch);                                    // 先滑過去，感覺才快
          const r = await api("/browser", { channel: ch });
          if (!r.ok) { cur = prev; slide(prev); }       // 失敗就滑回去
        };
      });
    }).catch(() => { /* 列不出來就算了，設定畫面還是可以改 */ });

    logCount = -1;
  }
  if (syncBrowser) syncBrowser(st.config.browser);
  if (st.log.length !== logCount) {
    logCount = st.log.length;
    const el = document.getElementById("log");
    el.innerHTML = st.log.length
      ? st.log.map((l) => `<div class="ln ${l.kind}"><span class="tm">${hhmm(l.at)}</span><span class="tx">${esc(l.text)}</span></div>`).join("")
      : '<div class="empty">還沒有動作。到網站上跟 Woby 說「幫我請假」試試。</div>';
    if (logOpen) el.scrollTop = el.scrollHeight;
    // 收起來時把最後一句放在標題旁邊
    const lastEl = document.getElementById("logLast");
    if (lastEl) lastEl.textContent = logOpen || !st.log.length ? "" : st.log[st.log.length - 1].text;
  }
}

/* 接上線時放一次邊框光。重播要先把 class 拿掉、強制 reflow，否則同一個動畫不會再跑。 */
let wasOnline = false;
function playGlow() {
  const g = document.getElementById("glow");
  if (!g) return;
  g.classList.remove("on");
  void g.offsetWidth;
  g.classList.add("on");
}

/* ── 狀態列 ── */
function drawPill(st) {
  const p = document.getElementById("pill"), t = document.getElementById("pillTxt");
  let cls = "", txt = "啟動中";
  if (st.screen === "boot") { txt = "啟動中"; }
  else if (st.screen === "setup") { txt = "還沒設定"; }
  else if (st.screen === "checking") { txt = "檢查中"; cls = "busy"; }
  else if (st.busy) { txt = st.task || "處理中"; cls = "busy"; }
  else if (st.status === "online") { txt = "已上線"; cls = "online"; }
  else if (st.status === "connecting") { txt = "連線中"; }
  else if (st.status === "duplicate") { txt = "重複開啟"; cls = "err"; }
  else if (st.status === "offline") { txt = "離線"; cls = "err"; }
  p.className = "pill " + cls;
  t.textContent = txt;
  // 從「不是上線」變成「上線」的那一刻 —— 也就是剛接上的時候
  if (st.status === "online" && !wasOnline) playGlow();
  wasOnline = st.status === "online";
}

async function tick() {
  try {
    const st = await api("/state");
    drawPill(st);
    if (st.screen === "boot") drawBoot();
    else if (st.screen === "setup") drawSetup(st);
    else if (st.screen === "checking") drawChecking(st);
    else drawRunning(st);
  } catch { /* 主程式關了，下一輪再試 */ }
}

// 視窗關掉的時候通知主程式收工（沒有小黑窗，這是使用者唯一的關閉方式）
addEventListener("pagehide", () => { try { navigator.sendBeacon("/bye"); } catch {} });

fetch("/logo").then((r) => r.text()).then((d) => { document.getElementById("logo").src = d; }).catch(() => {});
tick();
setInterval(tick, 1200);
</script>
